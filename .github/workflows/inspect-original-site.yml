name: Inspect original Fast Cut Films assets

on:
  push:
    paths:
      - '.github/workflows/inspect-original-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original homepage and CSS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .original-scan
          curl -L --fail --silent --show-error -A 'Mozilla/5.0' https://fastcutfilms.com/ -o .original-scan/home.html
          python3 - <<'PY'
          import re, html, urllib.parse, pathlib, subprocess
          base='https://fastcutfilms.com/'
          text=pathlib.Path('.original-scan/home.html').read_text(errors='ignore')
          css=[]
          for href in re.findall(r'<link[^>]+href=["\']([^"\']+\.css[^"\']*)["\']', text, flags=re.I):
              href=html.unescape(href)
              css.append(urllib.parse.urljoin(base, href))
          out=['CSS FILES', *css]
          sources=[('HOME HTML', text)]
          for i,url in enumerate(css):
              try:
                  p=f'.original-scan/css-{i}.css'
                  subprocess.run(['curl','-L','--fail','--silent','--show-error','-A','Mozilla/5.0',url,'-o',p],check=True)
                  c=pathlib.Path(p).read_text(errors='ignore')
                  sources.append((url,c))
              except Exception:
                  pass
          alltext='\n'.join(s for _,s in sources)
          urls=[]
          for u in re.findall(r'https?://[^\s\"\'\)]+', alltext):
              u=html.unescape(u).rstrip(';,')
              if 'fastcutfilms.com' in u and '/wp' in u and re.search(r'\.(?:jpg|jpeg|png|webp)(?:\?|$)',u,re.I):
                  urls.append(u)
          for u in re.findall(r'url\(([^)]+)\)', alltext, flags=re.I):
              u=u.strip(' \"\'')
              if not u or u.startswith('data:'):
                  continue
              u=urllib.parse.urljoin(base, html.unescape(u))
              if 'fastcutfilms.com' in u and re.search(r'\.(?:jpg|jpeg|png|webp)(?:\?|$)',u,re.I):
                  urls.append(u)
          out.append('\nIMAGE/BACKGROUND URLS')
          seen=set()
          for u in urls:
              if u not in seen:
                  seen.add(u); out.append(u)
          pathlib.Path('original-background-assets.txt').write_text('\n'.join(out)+'\n')

          needles=[
            'Edit-studio-monitor-FastCutFilms-Commercial-Video-Houston-2.webp',
            'fastcutfilms-header23.jpg',
            'Edit-studio-monitor-FastCutFilms-bg1.webp',
            'background-image'
          ]
          ctx=[]
          for name,src in sources:
              for needle in needles:
                  start=0
                  while True:
                      idx=src.find(needle,start)
                      if idx < 0: break
                      a=max(0,idx-700); b=min(len(src),idx+len(needle)+700)
                      ctx.append(f'\n=== {name} :: {needle} ===\n'+src[a:b].replace('><','>\n<'))
                      start=idx+len(needle)
          pathlib.Path('original-background-context.txt').write_text('\n'.join(ctx)+'\n')
          PY
      - name: Commit scan results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add original-background-assets.txt original-background-context.txt
          git diff --cached --quiet || git commit -m 'Record original Fast Cut Films background context'
          git push
